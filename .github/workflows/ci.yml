name: ci

# Shipped in the public export as .github/workflows/ci.yml (scripts/publish-public.sh).
# It lives outside .github/workflows/ here so the private repo does not run it
# beside its own gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
